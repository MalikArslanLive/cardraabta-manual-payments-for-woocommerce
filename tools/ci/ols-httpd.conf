serverName crmp-ci
disableWebAdmin 1
user nobody
group nogroup
mime conf/mime.properties
indexFiles index.php, index.html
errorlog /tmp/crmp-ols-error.log {
 logLevel INFO
 rollingSize 10M
}
accesslog /tmp/crmp-ols-access.log {
 rollingSize 10M
}
tuning {
 maxConnections 256
 maxSSLConnections 128
 maxReqBodySize 16M
}
CGIRLimit {
 maxCGIInstances 20
 minUID 10
 minGID 10
 priority 0
 CPUSoftLimit 10
 CPUHardLimit 50
 memSoftLimit 2047M
 memHardLimit 2047M
 procSoftLimit 400
 procHardLimit 450
}
scripthandler {
 add lsapi:lsphp php
}
extprocessor lsphp {
 type lsapi
 address uds://tmp/lshttpd/crmp-php.sock
 maxConns 10
 env PHP_LSAPI_CHILDREN=10
 initTimeout 60
 retryTimeout 0
 persistConn 1
 respBuffer 0
 autoStart 1
 path /usr/local/lsws/lsphp82/bin/lsphp
 backlog 100
 instances 1
}
virtualhost crmp {
 vhRoot /tmp/crmp-wp/
 configFile /usr/local/lsws/conf/vhosts/crmp.conf
 allowSymbolLink 1
 enableScript 1
 restrained 0
}
listener crmp {
 address *:8089
 secure 0
 map crmp *
}
