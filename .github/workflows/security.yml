name: Security and WordPress checks
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
  workflow_dispatch:
    inputs:
      retry_failed_matrix:
        description: Run full suites for the four failed PHP 8.5 and cache matrix cases
        type: boolean
        default: false
      linux_only:
        description: Run the full Linux matrix without repeating the native IIS guard
        type: boolean
        default: false
      iis_only:
        description: Run only the native Windows IIS guard test
        type: boolean
        default: false
      failed_checks_only:
        description: Retry only PHP 8.5 scanner/bootstrap and PHP 8.3 cache debug checks
        type: boolean
        default: false
      cache_only:
        description: Run only the PHP 8.3 / Nginx public-cache regression
        type: boolean
        default: false
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  wordpress:
    if: inputs.iis_only != true
    name: ${{ inputs.cache_only == true && 'Targeted public cache-hit check' || format('WordPress PHP {0} / {1} / {2} / {3}', matrix.php, matrix.server, matrix.wordpress, matrix.database) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON((inputs.failed_checks_only == true || inputs.retry_failed_matrix == true) && '["8.3","8.5"]' || inputs.cache_only == true && '["8.3"]' || '["8.1","8.2","8.3","8.4","8.5"]') }}
        server: ${{ fromJSON((inputs.failed_checks_only == true || inputs.retry_failed_matrix == true || inputs.cache_only == true) && '["nginx"]' || '["apache2","nginx"]') }}
        wordpress: ['latest']
        woocommerce: ['latest']
        database: ['mysql']
        include: >-
          ${{ fromJSON((inputs.failed_checks_only == true || inputs.retry_failed_matrix == true) && '[{"php":"8.5","server":"apache2","wordpress":"latest","woocommerce":"latest","database":"mysql"},{"php":"8.5","server":"nginx","wordpress":"latest","woocommerce":"latest","database":"mariadb"}]' || inputs.cache_only == true && '[]' || '[{"php":"8.1","server":"nginx","wordpress":"6.5","woocommerce":"8.3.0","database":"mysql"},{"php":"8.5","server":"nginx","wordpress":"latest","woocommerce":"latest","database":"mariadb"}]') }}
      max-parallel: 12
    env:
      WP_CLI_ALLOW_ROOT: '1'
      WP_CLI_CONFIG_PATH: /tmp/crmp-wp-cli.yml
      CRMP_WP_CLI_BUILD_REF: ad68e4ad3b29c3d3bdb361e5ed9b37e709123a9b
      CRMP_WP_PATH: /tmp/crmp-wp
      NODE_PATH: /tmp/crmp-browser/node_modules
      CRMP_PHP_VERSION: ${{ matrix.php }}
      CRMP_WEB_SERVER: ${{ matrix.server }}
    services:
      mysql:
        image: ${{ matrix.database == 'mariadb' && 'mariadb:10.11' || 'mysql:8.0' }}
        env:
          MYSQL_ROOT_PASSWORD: test-only
          MYSQL_DATABASE: crmp_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ptest-only || mariadb-admin ping -ptest-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, openssl, fileinfo, mbstring
          coverage: none
          ini-values: opcache.enable_cli=0, opcache.jit=0
      - name: Syntax and reproducible release package
        if: inputs.failed_checks_only != true
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find . -name '*.php' -not -path './.git/*' -print0)
          for file in assets/*.js; do node --check "$file"; done
          python3 tools/build-release.py
      - name: Isolated WordPress installation
        run: |
          set -euo pipefail
          exec > >(tee /tmp/crmp-setup.log) 2>&1
          trap 'tail -n 8 /tmp/crmp-setup.log | while IFS= read -r line; do line="${line//%/%25}"; line="${line//$'"'"'\r'"'"'/%0D}"; echo "::error title=WordPress setup failed::$line"; done' ERR
          printf 'color: false\n' > "$WP_CLI_CONFIG_PATH"
          wp_cli_artifact=wp-cli.phar
          # The pinned official nightly includes cli-tools' PHP 8.5 null-offset fix.
          if [[ "${CRMP_PHP_VERSION:-}" == 8.5 ]]; then wp_cli_artifact=wp-cli-nightly.phar; fi
          curl -fsSL "https://raw.githubusercontent.com/wp-cli/builds/$CRMP_WP_CLI_BUILD_REF/phar/$wp_cli_artifact" -o /tmp/wp.phar
          curl -fsSL "https://raw.githubusercontent.com/wp-cli/builds/$CRMP_WP_CLI_BUILD_REF/phar/$wp_cli_artifact.sha512" -o /tmp/wp.phar.sha512
          printf '%s  /tmp/wp.phar\n' "$(tr -d '\r\n' < /tmp/wp.phar.sha512)" | sha512sum --check --strict
          php /tmp/wp.phar core download --version="${{ matrix.wordpress }}" --path="$CRMP_WP_PATH"
          php /tmp/wp.phar config create --path="$CRMP_WP_PATH" --dbname=crmp_test --dbuser=root --dbpass=test-only --dbhost=127.0.0.1:3306
          php /tmp/wp.phar config set DISABLE_WP_CRON true --raw --path="$CRMP_WP_PATH"
          php /tmp/wp.phar core install --path="$CRMP_WP_PATH" --url=http://127.0.0.1:8089 --title=CRMP-Test --admin_user=auditor --admin_password=test-only-local --admin_email=audit@example.test --skip-email
          woo_version=()
          if [[ '${{ matrix.woocommerce }}' != latest ]]; then woo_version=(--version='${{ matrix.woocommerce }}'); fi
          php /tmp/wp.phar plugin install woocommerce "${woo_version[@]}" --activate --path="$CRMP_WP_PATH"
          php /tmp/wp.phar plugin install plugin-check --activate --skip-plugins=woocommerce --path="$CRMP_WP_PATH"
          test -s "$CRMP_WP_PATH/wp-content/plugins/plugin-check/cli.php"
          mkdir -p "$CRMP_WP_PATH/wp-content/mu-plugins"
          cp tests/test-site.php "$CRMP_WP_PATH/wp-content/mu-plugins/crmp-test.php"
          unzip -oq release-assets/cardraabta-manual-payments-for-woocommerce-v1.0.0.zip -d "$CRMP_WP_PATH/wp-content/plugins"
          # Initialize WooCommerce/Jetpack's first-run schedules before measuring this plugin.
          php /tmp/wp.phar eval 'echo "Dependency baseline initialized\n";' --skip-plugins=cardraabta-manual-payments-for-woocommerce --path="$CRMP_WP_PATH"
          php /tmp/wp.phar config set WP_DEBUG true --raw --path="$CRMP_WP_PATH"
          php /tmp/wp.phar config set WP_DEBUG_LOG true --raw --path="$CRMP_WP_PATH"
          php /tmp/wp.phar config set WP_DEBUG_DISPLAY false --raw --path="$CRMP_WP_PATH"
          : > "$CRMP_WP_PATH/wp-content/debug.log"
          php /tmp/wp.phar plugin activate cardraabta-manual-payments-for-woocommerce --path="$CRMP_WP_PATH"
          php /tmp/wp.phar plugin is-active cardraabta-manual-payments-for-woocommerce --path="$CRMP_WP_PATH"
      - name: Payment, privacy, locks, history, emails and HPOS
        if: inputs.cache_only != true && inputs.failed_checks_only != true
        run: |
          set -euo pipefail
          exec > >(tee /tmp/crmp-regression.log) 2>&1
          trap '(grep -E "^FAIL |Fatal error|Uncaught|AssertionError|RuntimeException|Error:" /tmp/crmp-regression.log || tail -n 8 /tmp/crmp-regression.log) | while IFS= read -r line; do line="${line//%/%25}"; line="${line//$'"'"'\r'"'"'/%0D}"; echo "::error title=Regression failed::$line"; done' ERR
          for test in evidence-directory public-store-audit admin-regression final-audit closed-submissions lock-integration release-lifecycle security-regression extended-security evidence-capabilities asset-cache checkout-mode hardening-regression release-regression email-regression email-log-regression; do
            php /tmp/wp.phar eval-file "tests/$test.php" --path="$CRMP_WP_PATH"
          done
          if php /tmp/wp.phar cli has-command 'wc hpos sync' --path="$CRMP_WP_PATH"; then
            php /tmp/wp.phar wc hpos sync --path="$CRMP_WP_PATH"
          else
            php /tmp/wp.phar wc cot sync --path="$CRMP_WP_PATH"
          fi
          php /tmp/wp.phar option update woocommerce_custom_orders_table_enabled yes --path="$CRMP_WP_PATH"
          for test in hardening-regression release-regression email-regression email-log-regression; do
            php /tmp/wp.phar eval-file "tests/$test.php" --path="$CRMP_WP_PATH"
          done
      - name: Real HTTP, mobile layouts and browser interactions
        if: inputs.cache_only != true && inputs.failed_checks_only != true
        run: |
          set -euo pipefail
          exec > >(tee /tmp/crmp-http.log) 2>&1
          trap 'tail -n 12 /tmp/crmp-http.log | while IFS= read -r line; do line="${line//%/%25}"; echo "::error title=HTTP tests failed::$line"; done' ERR
          pip install requests beautifulsoup4
          mkdir -p /tmp/crmp-browser
          cp tools/ci/browser/package*.json /tmp/crmp-browser/
          npm ci --ignore-scripts --prefix /tmp/crmp-browser
          /tmp/crmp-browser/node_modules/.bin/playwright install --with-deps chromium
          php /tmp/wp.phar option update siteurl http://127.0.0.1:8089 --path="$CRMP_WP_PATH"
          php /tmp/wp.phar option update home http://127.0.0.1:8089 --path="$CRMP_WP_PATH"
          php /tmp/wp.phar user update auditor --user_pass=test-only-local --role=administrator --path="$CRMP_WP_PATH"
          bash tools/ci/start-web.sh
          for test in release-http email-http email-log-http; do python3 "tests/$test.py"; done
          for test in release-dom admin-audit-dom email-dom email-log-dom checkout-copy-dom customer-form-dom; do node "tests/$test.cjs"; done
          php /tmp/wp.phar eval-file tests/checkout-design.php --path="$CRMP_WP_PATH"
          php /tmp/wp.phar eval-file tests/export-fields-fixture.php --path="$CRMP_WP_PATH"
          python3 tests/export-fields-http.py
          php /tmp/wp.phar eval-file tests/proof-policy.php --path="$CRMP_WP_PATH"
          node tests/proof-policy-dom.cjs
          node tests/checkout-mode-dom.cjs
          node tests/checkout-design-dom.cjs
          php /tmp/wp.phar eval-file tests/proof-limit.php --path="$CRMP_WP_PATH"
          node tests/proof-limit-dom.cjs
          node tests/release-responsive.cjs
          python3 tests/proof-limit-http.py
      - name: Real server privacy and runtime verification
        if: inputs.cache_only != true && inputs.failed_checks_only != true
        run: |
          set -euo pipefail
          exec > >(tee /tmp/crmp-server-security.log) 2>&1
          trap 'sleep 0.2; tail -n 14 /tmp/crmp-server-security.log | while IFS= read -r line; do line="${line//%/%25}"; echo "::error title=Server verification::$line"; done' ERR
          php /tmp/wp.phar eval-file tests/server-security.php --path="$CRMP_WP_PATH"
          node tests/checkout-upload-browser.cjs
          python3 tests/server-security-http.py
          python3 tests/performance-probe.py
      - name: Bootstrap the targeted cache runtime
        if: inputs.cache_only == true || (inputs.failed_checks_only == true && matrix.php == '8.3')
        run: |
          pip install requests beautifulsoup4
          bash tools/ci/start-web.sh
      - name: Real optimization, page cache and persistent object cache compatibility
        if: matrix.php == '8.3' && matrix.server == 'nginx' && matrix.wordpress == 'latest' && matrix.database == 'mysql'
        env:
          CRMP_DEBUG_ONLY: ${{ inputs.failed_checks_only == true && '1' || '0' }}
          CRMP_CACHE_ONLY: ${{ inputs.cache_only == true && '1' || '0' }}
        run: |
          set -euo pipefail
          exec > >(tee /tmp/crmp-optimization.log) 2>&1
          trap '(grep -E "^FAIL |AssertionError|Fatal error|Uncaught|RuntimeException|Error:" /tmp/crmp-optimization.log || tail -n 14 /tmp/crmp-optimization.log) | while IFS= read -r line; do line="${line//%/%25}"; echo "::error title=Optimization compatibility::$line"; done' ERR
          bash tools/ci/optimization.sh
      - name: Official Plugin Check including runtime checks
        if: inputs.cache_only != true
        run: |
          set -euo pipefail
          php /tmp/wp.phar plugin check cardraabta-manual-payments-for-woocommerce --format=strict-json --path="$CRMP_WP_PATH" --require="$CRMP_WP_PATH/wp-content/plugins/plugin-check/cli.php" | tee /tmp/crmp-plugin-check.log
          python3 tools/ci/check-plugin-report.py /tmp/crmp-plugin-check.log
      - name: PHPCS with WPCS security checks
        if: inputs.cache_only != true && inputs.failed_checks_only != true
        run: |
          php "$CRMP_WP_PATH/wp-content/plugins/plugin-check/vendor/bin/phpcs" --standard=WordPress --sniffs=WordPress.Security.EscapeOutput,WordPress.Security.NonceVerification,WordPress.Security.ValidatedSanitizedInput,WordPress.DB.PreparedSQL,WordPress.DB.PreparedSQLPlaceholders --extensions=php --report=summary "$CRMP_WP_PATH/wp-content/plugins/cardraabta-manual-payments-for-woocommerce/cardraabta-manual-payments-for-woocommerce.php" "$CRMP_WP_PATH/wp-content/plugins/cardraabta-manual-payments-for-woocommerce/includes" "$CRMP_WP_PATH/wp-content/plugins/cardraabta-manual-payments-for-woocommerce/uninstall.php"
      - name: Actual uninstall and reactivation retention
        if: inputs.cache_only != true && inputs.failed_checks_only != true
        run: |
          set -euo pipefail
          php /tmp/wp.phar eval-file tests/uninstall-retention.php setup --path="$CRMP_WP_PATH"
          php /tmp/wp.phar plugin uninstall cardraabta-manual-payments-for-woocommerce --deactivate --skip-delete --path="$CRMP_WP_PATH"
          php /tmp/wp.phar eval-file tests/uninstall-retention.php inactive --path="$CRMP_WP_PATH"
          php /tmp/wp.phar plugin activate cardraabta-manual-payments-for-woocommerce --path="$CRMP_WP_PATH"
          php /tmp/wp.phar plugin is-active cardraabta-manual-payments-for-woocommerce --path="$CRMP_WP_PATH"
          php /tmp/wp.phar eval-file tests/uninstall-retention.php reactivated --path="$CRMP_WP_PATH"
      - name: WordPress debug log gate
        if: inputs.cache_only != true
        run: python3 tools/ci/check-debug-log.py "$CRMP_WP_PATH/wp-content/debug.log"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: verification-php-${{ matrix.php }}-${{ matrix.server }}-wp-${{ matrix.wordpress }}-${{ matrix.database }}
          path: |
            release-assets/*v1.0.0.zip
            /tmp/crmp-plugin-check.log
            /tmp/crmp-optimization.log
            /tmp/crmp-optimizer-dependency-debug.log
            /tmp/crmp-optimization-fixture.json
            local-runtime/responsive/*.png
            /tmp/crmp-web-*.log
            /tmp/crmp-runtime-versions.json
            /tmp/crmp-latency.json
            /tmp/crmp-server-security.log
          if-no-files-found: ignore

  openlitespeed:
    if: inputs.iis_only != true && inputs.retry_failed_matrix != true && inputs.cache_only != true && inputs.failed_checks_only != true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WP_CLI_ALLOW_ROOT: '1'
      WP_CLI_CONFIG_PATH: /tmp/crmp-wp-cli.yml
      CRMP_WP_CLI_BUILD_REF: ad68e4ad3b29c3d3bdb361e5ed9b37e709123a9b
      CRMP_WP_PATH: /tmp/crmp-wp
      NODE_PATH: /tmp/crmp-browser/node_modules
      CRMP_WEB_SERVER: openlitespeed
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only
          MYSQL_DATABASE: crmp_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ptest-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, openssl, fileinfo, mbstring
          coverage: none
      - name: Prepare latest stable WordPress and WooCommerce
        run: |
          set -euo pipefail
          printf 'color: false\n' > "$WP_CLI_CONFIG_PATH"
          wp_cli_artifact=wp-cli.phar
          # The pinned official nightly includes cli-tools' PHP 8.5 null-offset fix.
          if [[ "${CRMP_PHP_VERSION:-}" == 8.5 ]]; then wp_cli_artifact=wp-cli-nightly.phar; fi
          curl -fsSL "https://raw.githubusercontent.com/wp-cli/builds/$CRMP_WP_CLI_BUILD_REF/phar/$wp_cli_artifact" -o /tmp/wp.phar
          curl -fsSL "https://raw.githubusercontent.com/wp-cli/builds/$CRMP_WP_CLI_BUILD_REF/phar/$wp_cli_artifact.sha512" -o /tmp/wp.phar.sha512
          printf '%s  /tmp/wp.phar\n' "$(tr -d '\r\n' < /tmp/wp.phar.sha512)" | sha512sum --check --strict
          php /tmp/wp.phar core download --path="$CRMP_WP_PATH"
          php /tmp/wp.phar config create --path="$CRMP_WP_PATH" --dbname=crmp_test --dbuser=root --dbpass=test-only --dbhost=127.0.0.1:3306
          php /tmp/wp.phar config set DISABLE_WP_CRON true --raw --path="$CRMP_WP_PATH"
          php /tmp/wp.phar core install --path="$CRMP_WP_PATH" --url=http://127.0.0.1:8089 --title=CRMP-Test --admin_user=auditor --admin_password=test-only-local --admin_email=audit@example.test --skip-email
          php /tmp/wp.phar plugin install woocommerce plugin-check --activate --path="$CRMP_WP_PATH"
          mkdir -p "$CRMP_WP_PATH/wp-content/mu-plugins"
          cp tests/test-site.php "$CRMP_WP_PATH/wp-content/mu-plugins/crmp-test.php"
          python3 tools/build-release.py
          unzip -oq release-assets/cardraabta-manual-payments-for-woocommerce-v1.0.0.zip -d "$CRMP_WP_PATH/wp-content/plugins"
          # Initialize WooCommerce/Jetpack's first-run schedules before measuring this plugin.
          php /tmp/wp.phar eval 'echo "Dependency baseline initialized\n";' --skip-plugins=cardraabta-manual-payments-for-woocommerce --path="$CRMP_WP_PATH"
          php /tmp/wp.phar config set WP_DEBUG true --raw --path="$CRMP_WP_PATH"
          php /tmp/wp.phar config set WP_DEBUG_LOG true --raw --path="$CRMP_WP_PATH"
          php /tmp/wp.phar config set WP_DEBUG_DISPLAY false --raw --path="$CRMP_WP_PATH"
          : > "$CRMP_WP_PATH/wp-content/debug.log"
          php /tmp/wp.phar plugin activate cardraabta-manual-payments-for-woocommerce --path="$CRMP_WP_PATH"
          php /tmp/wp.phar plugin is-active cardraabta-manual-payments-for-woocommerce --path="$CRMP_WP_PATH"
          pip install requests beautifulsoup4
          mkdir -p /tmp/crmp-browser
          cp tools/ci/browser/package*.json /tmp/crmp-browser/
          npm ci --ignore-scripts --prefix /tmp/crmp-browser
          /tmp/crmp-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: LSAPI payment, security, uploads, browser and Plugin Check
        run: |
          set -euo pipefail
          exec > >(tee /tmp/crmp-ols-tests.log) 2>&1
          trap '(grep -E "^FAIL |Fatal error|Uncaught|AssertionError|RuntimeException|Error:" /tmp/crmp-ols-tests.log || tail -n 16 /tmp/crmp-ols-tests.log) | while IFS= read -r line; do line="${line//%/%25}"; echo "::error title=OpenLiteSpeed tests::$line"; done' ERR
          bash tools/ci/openlitespeed.sh
      - name: PHPCS with WPCS security checks
        if: inputs.cache_only != true && inputs.failed_checks_only != true
        run: |
          php "$CRMP_WP_PATH/wp-content/plugins/plugin-check/vendor/bin/phpcs" --standard=WordPress --sniffs=WordPress.Security.EscapeOutput,WordPress.Security.NonceVerification,WordPress.Security.ValidatedSanitizedInput,WordPress.DB.PreparedSQL,WordPress.DB.PreparedSQLPlaceholders --extensions=php --report=summary "$CRMP_WP_PATH/wp-content/plugins/cardraabta-manual-payments-for-woocommerce/cardraabta-manual-payments-for-woocommerce.php" "$CRMP_WP_PATH/wp-content/plugins/cardraabta-manual-payments-for-woocommerce/includes" "$CRMP_WP_PATH/wp-content/plugins/cardraabta-manual-payments-for-woocommerce/uninstall.php"
      - name: WordPress debug log gate
        if: inputs.cache_only != true
        run: python3 tools/ci/check-debug-log.py "$CRMP_WP_PATH/wp-content/debug.log"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: openlitespeed-evidence
          path: |
            /tmp/crmp-runtime-versions.json
            /tmp/crmp-latency.json
            /tmp/crmp-ols-tests.log
            /tmp/crmp-ols-error.log
            local-runtime/responsive/*.png


  iis-guard:
    name: Native IIS and PHP FastCGI evidence guard
    if: inputs.iis_only == true || (inputs.linux_only != true && inputs.retry_failed_matrix != true && inputs.cache_only != true && inputs.failed_checks_only != true)
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      WP_CLI_ALLOW_ROOT: '1'
      CRMP_WP_CLI_BUILD_REF: ad68e4ad3b29c3d3bdb361e5ed9b37e709123a9b
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          coverage: none
      - name: Download verified WordPress helpers
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $cli = Join-Path $env:RUNNER_TEMP 'wp-iis.phar'
          $base = "https://raw.githubusercontent.com/wp-cli/builds/$env:CRMP_WP_CLI_BUILD_REF/phar/wp-cli.phar"
          Invoke-WebRequest $base -OutFile $cli -UseBasicParsing
          $expected = (Invoke-WebRequest "$base.sha512" -UseBasicParsing).Content.Trim()
          if ($expected -notmatch '^[a-fA-F0-9]{128}$' -or (Get-FileHash $cli -Algorithm SHA512).Hash -ne $expected) { throw 'WP-CLI checksum mismatch' }
          php $cli core download --skip-content --path="$env:RUNNER_TEMP/crmp-iis-core"
          if ($LASTEXITCODE) { throw 'WordPress helper download failed' }
      - name: Actual IIS URL authorization and guard creation
        shell: powershell
        run: ./tools/ci/iis-guard.ps1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-iis-guard-evidence
          path: |
            ${{ runner.temp }}/crmp-iis/runtime.json
            ${{ runner.temp }}/crmp-iis/php-errors.log
          if-no-files-found: ignore
